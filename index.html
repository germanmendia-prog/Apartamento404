<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC20E">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Medidas Apto Jacaranda B3</title>
<meta name="description" content="Planos y medidas de muebles para llevar en el celular.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Medidas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --surface2:#F2F5F7; --ink:#14202B; --muted:#55646F; --line:#D2D9DF;
  --tape:#FFC20E; --tape-ink:#1A1400;
  --ok:#0F6B52; --okbg:#DCF2E8; --warn:#7D5200; --warnbg:#FFEFC2; --bad:#AE2A20; --badbg:#FBDFDA;
  --focus:#1459D9;
  --num:"DIN Condensed","Bahnschrift","Roboto Condensed",sans-serif-condensed,"Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav:62px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D141A; --surface:#17212A; --surface2:#1E2A34; --ink:#E8EEF2; --muted:#9FB0BC; --line:#2B3945;
    --ok:#56D0A6; --okbg:#10362B; --warn:#F2BE55; --warnbg:#3A2C0B; --bad:#FF9686; --badbg:#42201B;
    --focus:#8DB4FF;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);display:flex;flex-direction:column;height:100dvh;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
[hidden]{display:none!important}

/* ---- cinta métrica (cabecera) ---- */
.tape{position:relative;flex:none;background:var(--tape);color:var(--tape-ink);padding:calc(env(safe-area-inset-top) + 10px) 16px 20px;display:flex;align-items:center;gap:12px}
.tape::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;pointer-events:none;
  background:
   repeating-linear-gradient(90deg,var(--tape-ink) 0 1.5px,transparent 1.5px 40px) left bottom/100% 12px no-repeat,
   repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 8px) left bottom/100% 6px no-repeat}
.tape .ttl{flex:1;min-width:0}
.tape h1{font-family:var(--num);font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em}
.tape .sub{font-size:13px;line-height:1.2;margin-top:3px;font-weight:600;opacity:.8}
.seg{display:inline-flex;border:2px solid var(--tape-ink);border-radius:999px;overflow:hidden}
.seg button{min-width:44px;height:36px;padding:0 10px;font-weight:700;font-size:14px;color:var(--tape-ink)}
.seg button[aria-pressed=true]{background:var(--tape-ink);color:var(--tape)}
.ibtn{width:40px;height:40px;border:2px solid var(--tape-ink);border-radius:50%;font-weight:800;color:var(--tape-ink);font-size:17px}

/* ---- navegación inferior ---- */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:30}
nav.tabs button{position:relative;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:var(--ink)}
nav.tabs button[aria-selected=true]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--tape)}
nav.tabs button[aria-selected=true] svg{stroke-width:2.3}

main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---- chips ---- */
.chips{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--ac,var(--muted));display:block}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true] i{box-shadow:0 0 0 1.5px var(--bg)}

/* ---- planos ---- */
.ptop{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 16px 0;gap:8px}
.ptop h2{font-size:18px;font-weight:700}
.btn{height:40px;padding:0 16px;border-radius:10px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--tape);color:var(--tape-ink)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.line{border:1.5px solid var(--line);background:var(--surface)}
.btn.sm{height:38px;padding:0 12px;font-size:14px}
a.btn{text-decoration:none;color:var(--ink)}
.btn.bad{color:var(--bad)}
.vp{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:#E4E9EC;border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:grab;user-select:none;-webkit-user-select:none}
.vp:active{cursor:grabbing}
.psvg{display:block;width:100%;height:100%}
.psvg text{font-family:var(--sans);pointer-events:none}
.psvg .it{cursor:pointer;outline:none}
.psvg .it.dim{opacity:.16}
.psvg .it .halo{display:none;fill:none;stroke:#FFC20E;stroke-width:7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.psvg .it.sel .halo{display:block}
.psvg .it:focus-visible .halo{display:block;stroke:var(--focus)}
.psvg .room{fill:transparent;stroke:none;pointer-events:all}
.psvg .room.sel{fill:rgba(255,194,14,.22);stroke:#E0A400;stroke-width:2;vector-effect:non-scaling-stroke}
.psvg .lbl{pointer-events:none}
.psvg.lo .lbl{display:none}
.psvg .rl{font-weight:600;fill:#3b4a43;font-size:calc(11.5px*min(var(--inv,1),1.9));paint-order:stroke;stroke:#fff;stroke-width:calc(3px*min(var(--inv,1),1.9));stroke-linejoin:round;letter-spacing:.01em}
.psvg .rshort{display:none}
.psvg.lo .rshort{display:inline}
.psvg.lo .rlong{display:none}
.psvg .sc{font-size:calc(11.5px*min(var(--inv,1),1.9));font-weight:600;fill:#1f2a24}
.psvg.lo .rl .rd{display:none}
.psvg .rl .rd{font-weight:500;fill:#566159}
.zc{position:absolute;right:12px;bottom:calc(12px + var(--ch,0px));transition:bottom .18s ease-out;display:flex;flex-direction:column;gap:8px}
.zc button{width:46px;height:46px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.14);font-size:24px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
.zc svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.legend{position:absolute;left:12px;top:12px;max-width:min(280px,calc(100% - 24px));background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:14px;display:grid;gap:8px;cursor:default}
.legend div{display:flex;align-items:center;gap:10px}
.legend .sw{flex:none;width:22px;height:14px;border-radius:3px;border:1.5px solid var(--muted)}
.legend .ln{flex:none;width:22px;height:0;border-top:2.5px dotted}

.pcard{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--ac,var(--ink));border-radius:14px;padding:12px 14px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:grid;gap:8px;animation:up .18s ease-out;z-index:5}
.pcard .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard h3{font-size:18px;line-height:1.2}
.pcard .am{font-size:13px;color:var(--muted);font-weight:600}
.pcard .x{flex:none;width:40px;height:40px;margin:-8px -8px 0 0;font-size:20px;color:var(--muted)}
.pcard .ms{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.pcard .ms>div{display:grid}
.pcard .ms small{font-size:12px;color:var(--muted);font-weight:600}
.pcard .ms b{font-size:28px;line-height:1.05}
.pcard .ms b.s{font-size:22px;color:var(--muted)}
.pcard p{font-size:14px;color:var(--muted)}
.pcard .acts{display:flex;gap:8px;flex-wrap:wrap}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* ---- muebles ---- */
.sticky{flex:none;background:var(--bg);padding:10px 16px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-bottom:1px solid var(--line)}
.sticky .chips{padding:0 0 10px;margin:0 -16px;padding-inline:16px}
.srow{display:flex;gap:10px}
.search{flex:1;min-width:0;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.search::placeholder{color:var(--muted)}
.list{padding:6px 16px 28px;display:flex;flex-direction:column;gap:10px}
.list>*{flex:none}
.grp{display:flex;align-items:baseline;gap:10px;margin:14px 2px 0;font-weight:700;font-size:17px}
.grp i{width:12px;height:12px;border-radius:3px;background:var(--ac);align-self:center}
.grp small{font-weight:500;color:var(--muted);font-size:14px}
.grp.first{margin-top:6px}
.row{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--ac);border-radius:12px;padding:11px 14px 12px;display:grid;gap:3px;min-height:64px;width:100%}
.row:active{background:var(--surface2)}
.row .rn{font-weight:700;font-size:17px;line-height:1.2;padding-right:92px}
.row .rn small{font-weight:500;font-size:13px;color:var(--muted);display:block}
.row .rp{position:absolute;top:10px;right:12px;font-size:13px;font-weight:700;background:var(--tape);color:var(--tape-ink);border-radius:999px;padding:3px 10px}
.row .rp.pick::before{content:"★ "}
.row .rp.none{background:none;color:var(--muted);font-weight:600;padding-right:0}
.row .rd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.row .rd .big{font-size:29px;line-height:1.05}
.row .rd i{font-style:normal;font-size:14px;color:var(--muted);font-weight:600}
.row .rd .mx{margin-left:10px;color:var(--muted);font-size:14px}
.row .rd .mx b{font-size:20px;color:var(--ink)}
.row .rt{font-size:14px;color:var(--muted)}
.empty{padding:36px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* ---- cotización ---- */
.sum{margin:14px 16px 4px;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.sum small{font-size:13px;opacity:.8;font-weight:600}
.sum .tot{font-size:40px;line-height:1}
.sum .tot span{font-size:20px;opacity:.8;margin-right:4px}
.sum .brk{font-size:13px;opacity:.85}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}

/* ---- hoja inferior ---- */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:50;animation:fade .18s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:94dvh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;box-shadow:0 -8px 30px rgba(0,0,0,.3);max-width:640px;margin:0 auto}
.sheet .grab{flex:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet .body{overflow-y:auto;overscroll-behavior:contain;padding:6px 16px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:16px}
.sheet .body>*{flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh-head{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;border-left:6px solid var(--ac,var(--ink));padding-left:12px}
.sh-head h2{font-size:24px;line-height:1.15}
.sh-head .am{font-size:13px;font-weight:600;color:var(--muted)}
.sh-head .x{flex:none;width:44px;height:44px;margin:-4px -8px 0 0;font-size:22px;color:var(--muted)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card h3{font-size:16px}
.meas{display:flex;gap:22px;flex-wrap:wrap}
.meas>div{display:grid;gap:0}
.meas small{font-size:13px;color:var(--muted);font-weight:600}
.meas b{font-size:38px;line-height:1.05}
.meas b.s{font-size:28px;color:var(--muted)}
.meas em{font-style:normal;font-size:13px;color:var(--muted)}
.fp{display:block;width:100%;height:auto;max-height:190px}
.fpl{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.fpl span{display:inline-flex;align-items:center;gap:6px}
.fpl i{width:14px;height:12px;border-radius:3px;border:1.5px solid transparent;display:block}
.fp text{font-family:var(--num);font-weight:700;font-size:13px;fill:var(--muted)}
.inp{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f.w2{grid-column:1/-1}
label.f input,label.f textarea,label.f select{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);padding:0 12px;font-size:17px;color:var(--ink);width:100%}
label.f textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical;font-size:16px}
label.f input:focus,label.f textarea:focus{border-color:var(--focus)}
.hint{font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:6px 10px}
.vd{border-radius:12px;padding:12px 14px;display:grid;gap:3px;background:var(--surface2);color:var(--muted);font-size:14px}
.vd b{font-size:20px;line-height:1.15}
.vd.rec{background:var(--okbg);color:var(--ok)}
.vd.max{background:var(--warnbg);color:var(--warn)}
.vd.no{background:var(--badbg);color:var(--bad)}
.vd .sl{font-size:14px;font-weight:600}
.q{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.q.pick{border-color:var(--tape);box-shadow:inset 5px 0 0 var(--tape)}
.q .qh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.q .qn{font-weight:700;font-size:17px;line-height:1.2}
.q .qn small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.q .pr{font-size:28px;line-height:1;text-align:right;white-space:nowrap}
.q .pr small{display:block;font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:600;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted)}
.tag.low{background:var(--okbg);color:var(--ok)}
.tag.rec{background:var(--okbg);color:var(--ok)}
.tag.max{background:var(--warnbg);color:var(--warn)}
.tag.no{background:var(--badbg);color:var(--bad)}
.q .qa{display:flex;gap:8px;flex-wrap:wrap}
.q p{font-size:14px;color:var(--muted)}
.res{display:grid;gap:8px}
.res button{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;width:100%}
.res .t{display:flex;gap:8px;align-items:center;justify-content:space-between}
.res .t b{font-size:16px}
.res small{font-size:13px;color:var(--muted)}
.res .btn{width:100%}
.res h3{font-size:15px;margin:6px 2px 0}
.note{font-size:14px;color:var(--muted)}
.help ol,.help ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.help h3{margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;border-radius:999px;padding:10px 18px;z-index:90;animation:fade .15s ease-out;max-width:90vw;text-align:center}
.warnbar{flex:none;background:var(--warnbg);color:var(--warn);font-size:13px;font-weight:600;padding:6px 16px}

@media (min-width:760px){
  .list,.sum,.tools{max-width:720px;margin-inline:auto;width:100%}
  .tools{padding-inline:0}
  .sum{margin-top:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="tape">
  <div class="ttl"><h1>Medidas</h1><div class="sub">Apto Jacaranda B3</div></div>
  <div class="seg" role="group" aria-label="Unidad de medida"><button type="button" data-unit="cm" aria-pressed="true">cm</button><button type="button" data-unit="m" aria-pressed="false">m</button></div>
  <button class="ibtn" type="button" id="btn-help" aria-label="Ayuda e instalación">?</button>
</header>
<div class="warnbar" id="warn" hidden>Este navegador no deja guardar datos. Las cotizaciones se perderán al cerrar.</div>
<main>
  <section class="tab" id="tab-v1" role="tabpanel" hidden></section>
  <section class="tab" id="tab-v2" role="tabpanel" hidden></section>
  <section class="tab" id="tab-muebles" role="tabpanel" hidden></section>
  <section class="tab" id="tab-cot" role="tabpanel" hidden></section>
</main>
<nav class="tabs" role="tablist" aria-label="Secciones">
  <button role="tab" data-tab="v1" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/><path d="M3 12h8M11 3v6M16 12v9M16 7h5"/></svg>Versión 1</button>
  <button role="tab" data-tab="v2" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/><path d="M3 12h8M11 3v6M16 12v9M16 7h5"/><rect x="4.5" y="4.5" width="4" height="5" rx=".6"/></svg>Versión 2</button>
  <button role="tab" data-tab="muebles" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 17V8h18v9"/><path d="M3 12h18M3 17v3M21 17v3"/><path d="M7 8v4M12 8v4M17 8v4"/></svg>Muebles</button>
  <button role="tab" data-tab="cot" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 12.5V4h8.5l9 9-8.5 8.5z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>Cotización</button>
</nav>

<script>
(() => {
'use strict';
/* ================= util ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ================= guardado local ================= */
const KEY = 'medidas-jacaranda-b3-v1';
let canSave = true;
function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { canSave = false; return null; } }
const S = Object.assign({ unit: 'cm', quotes: {}, notes: {}, custom: [] }, load() || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { canSave = false; $('#warn').hidden = false; } }
if (!canSave) $('#warn').hidden = false;

/* ================= unidades ================= */
const fu = () => S.unit === 'm' ? 'm' : 'cm';
function fnum(cm) {
  if (cm == null || isNaN(cm)) return '?';
  if (S.unit === 'm') { let s = (cm / 100).toFixed(3); if (s.endsWith('0')) s = s.slice(0, -1); return s; }

function limitsOf(m) {

function fit(m, w, d, h) {
  const air = m.air || 0;
  const ls = limitsOf(m);
  if (!ls.length || (w == null && d == null)) return null;
  const rs = ls.map(L => {
    const [lw, ld, lh] = L.d;
    const dw = (lw != null && w != null) ? lw - w : null;
    const dd = (ld != null && d != null) ? ld - (d + air) : null;
    const dh = (lh != null && h != null) ? lh - h : null;
    const ok = [dw, dd, dh].every(v => v == null || v >= -0.04);
    return { k: L.k, dw, dd, dh, ok };
  });
  if (!rs.some(r => r.dw != null || r.dd != null || r.dh != null)) return null;
  let st, ref;
  if (m.kind === 'hueco') { ref = rs[0]; st = ref.ok ? 'rec' : 'no'; }
  else if (rs[0].ok) { st = 'rec'; ref = rs[0]; }
  else if (rs[1].ok) { st = 'max'; ref = rs[1]; }
  else { st = 'no'; ref = rs[1]; }
  const sl = (lab, v) => v == null ? null : (Math.abs(v) < 0.05 ? `${lab}: justo` : (v > 0 ? `${lab}: sobran ${fnum(v)} ${fu()}` : `${lab}: te pasas ${fnum(-v)} ${fu()}`));
  const parts = [sl('Ancho', ref.dw), sl('Fondo', ref.dd), sl('Alto', ref.dh)].filter(Boolean);
  const score = [ref.dw, ref.dd, ref.dh].filter(v => v != null).reduce((a, v) => a + Math.abs(v), 0);
  return { st, parts, ref, score, air };
}

  const ls = limitsOf(m); if (!ls.length) return false;
  const lw = ls[0].d[0], ld = ls[0].d[1];

function mountCot() {

function renderCot() {
  const el = $('#cot-s'); if (!el) return;
  const items = allItems().filter(m => !m.planOnly);
  let total = 0, nPick = 0, nQ = 0, nNone = 0;
  items.forEach(m => { const i = qinfo(m); total += i.est; if (i.pick) nPick++; else if (i.qs.length) nQ++; else nNone++; });
  const cfs = [['todos', 'Todos'], ['sin', 'Sin cotizar'], ['cot', 'Cotizados'], ['pick', 'Elegidos']];
  let h = `<div class="sum"><small>Total estimado</small><div class="tot num"><span>Q</span>${(Math.round(total * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 })}</div><div class="brk">${pl(nPick, 'elegido', 'elegidos')} · ${pl(nQ, 'cotizado', 'cotizados')} · ${nNone} sin cotizar. Si no eliges, cuenta la más barata.</div></div>`;
  h += `<div class="chips" role="group" aria-label="Filtrar">${cfs.map(([k, l]) => `<button class="chip" type="button" data-cf="${k}" aria-pressed="${cotFilter === k}">${l}</button>`).join('')}</div>`;
  h += `<div class="list" style="padding-top:0">`;
  let first = true, shown = 0;
  ORDER.forEach(k => {
    const g = items.filter(m => m.a === k).filter(m => {
      const i = qinfo(m);
      return cotFilter === 'todos' || (cotFilter === 'sin' && !i.qs.length) || (cotFilter === 'cot' && i.qs.length) || (cotFilter === 'pick' && i.pick);
    });
    if (!g.length) return;
    h += grpHead(k, first); first = false;
    g.forEach(m => {
      shown++;
      const i = qinfo(m), A = AMB[m.a];
      let sub = 'Sin cotizar';
      if (i.pick) sub = `Elegida: ${esc(i.pick.marca || 'sin marca')}${i.pick.tienda ? ' · ' + esc(i.pick.tienda) : ''}`;
      else if (i.qs.length) sub = `${i.qs.length} cotización${i.qs.length > 1 ? 'es' : ''}`;
      h += `<button class="row" type="button" data-open="${m.id}" style="--ac:${A.c}"><span class="rn">${esc(m.n)}</span>${priceTag(m)}<span class="rt">${sub}${i.pick && (i.pick.qty || 1) > 1 ? ` · ×${i.pick.qty}` : ''}</span></button>`;
    });
  });
  if (!shown) h += `<div class="empty"><b>Nada por aquí todavía</b>${cotFilter === 'pick' ? 'Elige una cotización con la estrella.' : 'Abre un mueble y agrega su primera cotización.'}</div>`;
  h += `</div><div class="tools"><button class="btn line sm" type="button" data-act="add">+ Otro mueble</button><button class="btn line sm" type="button" data-act="copy">Copiar resumen</button><button class="btn line sm" type="button" data-act="export">Guardar respaldo</button><button class="btn line sm" type="button" data-act="import">Cargar respaldo</button></div><p class="note" style="padding:0 16px 28px">Todo se guarda solo en este celular. Si cambias de teléfono, usa el respaldo.</p>`;
  el.innerHTML = h;
}
function summaryText() {
  let t = 'Cotización · Apto Jacaranda B3\n', total = 0;
  ORDER.forEach(k => {
    const g = allItems().filter(m => m.a === k && qsOf(m.id).length);
    if (!g.length) return;
    t += `\n${AMB[k].n}\n`;
    g.forEach(m => {
      const i = qinfo(m), q = i.pick || i.min; total += lineTotal(q);
      t += `- ${m.n}${i.pick ? ' (elegida)' : ''}: ${[q.marca, q.tienda, q.tel].filter(Boolean).join(', ') || 'sin datos'} · ${money(q.precio)}${(q.qty || 1) > 1 ? ` × ${q.qty} = ${money(lineTotal(q))}` : ''}\n`;
    });
  });
  return t + `\nTotal estimado: ${money(total)}`;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try { const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); const ok = document.execCommand('copy'); a.remove(); return ok; } catch (e) { return false; }
}
async function copySummary() {
  const t = summaryText();
  if (navigator.share) { try { await navigator.share({ title: 'Cotización', text: t }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  toast(await copyText(t) ? 'Resumen copiado' : 'No se pudo copiar');
}
function exportBackup() {

  a.download = 'medidas-respaldo-' + new Date().toISOString().slice(0, 10) + '.json';

}

let sheetEl = null, scrimEl = null, cur = null, prefill = null;
function openSheetShell(kind) {
  if (!sheetOpen) {
    scrimEl = document.createElement('div'); scrimEl.className = 'scrim'; scrimEl.addEventListener('click', () => closeSheet());
    sheetEl = document.createElement('div'); sheetEl.className = 'sheet'; sheetEl.setAttribute('role', 'dialog'); sheetEl.setAttribute('aria-modal', 'true');
    sheetEl.innerHTML = '<div class="grab"></div><div class="body"></div>';

}
function closeSheet(fromPop) {

function footprintSVG(m, w, d) {
  const lim = limitsOf(m); if (!lim.length) return '';
  const rec = lim[0].d, mx = lim[1] ? lim[1].d : null;
  const air = m.air || 0, isH = m.kind === 'hueco';
  const rw = rec[0], rd = rec[1];
  if (rw == null || rd == null) return '';
  const pd = d != null ? d + air : rd;
  const dw = Math.max(rw, mx ? mx[0] : 0, w || 0), dd = Math.max(rd, mx ? mx[1] : 0, w != null ? pd : 0);
  const W = 320, H = 180, pad = 26, k = Math.min((W - pad * 2) / dw, (H - pad * 2) / dd);
  const ox = pad, oy = pad - 8;
  const A = AMB[m.a];
  let s = `<svg class="fp" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dibujo a escala">`;
  if (mx && (mx[0] !== rw || mx[1] !== rd)) s += `<rect x="${ox}" y="${oy}" width="${mx[0] * k}" height="${mx[1] * k}" fill="none" stroke="${A.c}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s += `<rect x="${ox}" y="${oy}" width="${rw * k}" height="${rd * k}" fill="${A.f}" fill-opacity="${isH ? .6 : 1}" rx="3"/>`;
  if (w != null) {
    s += `<rect x="${ox}" y="${oy}" width="${w * k}" height="${pd * k}" fill="#FFC20E" fill-opacity=".38" stroke="#1A1400" stroke-width="2.5" rx="3"/>`;
    if (air) s += `<rect x="${ox}" y="${oy}" width="${w * k}" height="${air * k}" fill="#1A1400" fill-opacity=".22"/>`;
  }
  s += `<rect x="${ox}" y="${oy}" width="${rw * k}" height="${rd * k}" fill="none" stroke="${A.c}" stroke-width="2" ${isH ? 'stroke-dasharray="5 4"' : ''} rx="3"/>`;
  s += `<text x="${ox + rw * k / 2}" y="${oy + dd * k + 16}" text-anchor="middle">${fnum(rw)}</text>`;
  s += `<text x="${ox + dw * k + 8}" y="${oy + rd * k / 2 + 5}">${fnum(rd)}</text>`;
  if (air) s += `<text x="${ox + dw * k + 8}" y="${oy + 9}" style="font-size:11px">pared</text>`;
  s += `</svg>`;
  s += `<div class="fpl"><span><i style="background:${A.f};border-color:${A.c}"></i>${isH ? 'Hueco' : 'Recomendado'}</span>${mx && (mx[0] !== rw || mx[1] !== rd) ? `<span><i style="border:1.5px dashed ${A.c}"></i>Máximo</span>` : ''}${w != null ? '<span><i style="background:rgba(255,194,14,.6);border-color:#1A1400"></i>Tu pieza</span>' : ''}</div>`;
  return s;
}

  };
  const inputs = ['#cw', '#cd', '#ch'].map(s => $(s, body));
  const upd = () => {

  inputs.forEach(i => i && i.addEventListener('input', upd));

function renderQuotes(editId) {
  const m = cur; if (!m) return;
  const box = $('#qsec', sheetEl); if (!box) return;
  const qs = qsOf(m.id);
  const lowest = qs.length > 1 ? Math.min(...qs.map(q => q.precio)) : null;
  let h = '';
  if (!qs.length && editId !== 'new') h += `<p class="note">Aún no hay cotizaciones. Guarda marca, tienda, teléfono y precio de cada opción que veas.</p>`;
  qs.forEach(q => {
    if (editId === q.id) return;
    const f = (q.w != null || q.d != null) ? fit(m, q.w, q.d, null) : null;
    h += `<div class="q${q.pick ? ' pick' : ''}" data-q="${q.id}">
      <div class="qh"><div class="qn">${esc(q.marca || 'Sin marca')}<small>${esc(q.tienda || 'Sin tienda')}</small></div><div class="pr num">${money(q.precio)}${(q.qty || 1) > 1 ? `<small>× ${q.qty} = ${money(lineTotal(q))}</small>` : ''}</div></div>
      <div>${q.pick ? '<span class="tag" style="background:var(--tape);color:var(--tape-ink)">★ Elegida</span> ' : ''}${lowest != null && q.precio === lowest ? '<span class="tag low">Más barata</span> ' : ''}${f ? `<span class="tag ${f.st}">${vlab(m, f)}</span> ` : ''}${(q.w != null || q.d != null) ? `<span class="tag">${fdims([q.w, q.d])} ${fu()}</span>` : ''}</div>
      ${q.nota ? `<p>${esc(q.nota)}</p>` : ''}
      <div class="qa">${q.tel ? `<a class="btn line sm" href="tel:${esc(q.tel.replace(/[^\d+]/g, ''))}">Llamar ${esc(q.tel)}</a>` : ''}<button class="btn line sm" type="button" data-qa="pick">${q.pick ? 'Quitar elección' : '★ Elegir'}</button><button class="btn line sm" type="button" data-qa="edit">Editar</button><button class="btn line sm bad" type="button" data-qa="del">Borrar</button></div></div>`;
  });
  const ed = editId && editId !== 'new' ? qs.find(q => q.id === editId) : null;
  if (editId) {
    const v = ed || { qty: m.qty || 1, w: prefill && prefill.w, d: prefill && prefill.d };
    const w0 = $('#cw', sheetEl), d0 = $('#cd', sheetEl);
    const pw = ed ? ed.w : (w0 ? pnum(w0.value) : null), pd = ed ? ed.d : (d0 ? pnum(d0.value) : null);
    h += `<form class="q" id="qf" autocomplete="off" style="gap:10px"><div class="inp">
      <label class="f">Marca<input name="marca" value="${esc(v.marca || '')}" maxlength="60"></label>
      <label class="f">Tienda<input name="tienda" value="${esc(v.tienda || '')}" maxlength="60"></label>
      <label class="f">Teléfono<input name="tel" type="tel" inputmode="tel" value="${esc(v.tel || '')}" maxlength="30"></label>
      <label class="f">Precio (Q)<input name="precio" inputmode="decimal" value="${v.precio != null ? v.precio : ''}" required></label>
      <label class="f">Cantidad<input name="qty" inputmode="numeric" value="${v.qty || 1}"></label>
      <label class="f">Ancho (${fu()})<input name="w" inputmode="decimal" value="${pw != null ? fnum(pw) : ''}"></label>
      <label class="f">Fondo (${fu()})<input name="d" inputmode="decimal" value="${pd != null ? fnum(pd) : ''}"></label>
      <label class="f w2">Nota<input name="nota" value="${esc(v.nota || '')}" maxlength="200" placeholder="Garantía, entrega, color…"></label></div>
      <div class="qa"><button class="btn ink" type="submit">Guardar cotización</button><button class="btn line" type="button" data-qa="cancel">Cancelar</button></div></form>`;
  } else {
    h += `<button class="btn pri" type="button" data-qa="new" style="width:100%">+ Agregar cotización</button>`;
  }
  box.innerHTML = h;
  box.onclick = e => {
    const b = e.target.closest('[data-qa]'); if (!b) return;
    const a = b.dataset.qa, qEl = b.closest('[data-q]'), id = qEl && qEl.dataset.q;
    if (a === 'new') renderQuotes('new');
    else if (a === 'cancel') renderQuotes();
    else if (a === 'edit') renderQuotes(id);
    else if (a === 'del') { if (confirm('¿Borrar esta cotización?')) { S.quotes[m.id] = qsOf(m.id).filter(q => q.id !== id); save(); renderQuotes(); } }
    else if (a === 'pick') { const on = !qsOf(m.id).find(q => q.id === id).pick; qsOf(m.id).forEach(q => q.pick = on && q.id === id); save(); renderQuotes(); }
  };
  const f = $('#qf', box);
  if (f) {
    f.addEventListener('submit', e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(f));
      const precio = parseFloat(String(fd.precio).replace(/[^\d.,]/g, '').replace(',', '.'));
      if (isNaN(precio)) { toast('Escribe el precio'); return; }
      const o = { marca: fd.marca.trim(), tienda: fd.tienda.trim(), tel: fd.tel.trim(), precio, qty: Math.max(1, parseInt(fd.qty, 10) || 1), w: pnum(fd.w), d: pnum(fd.d), nota: fd.nota.trim() };

      save(); renderQuotes(); toast('Cotización guardada');
    });

  }
}

    if (w == null && d == null) { out.innerHTML = `<p class="note">Escribe el ancho y el fondo de lo que viste. Te digo en qué espacios entra y cuánto sobra o falta.</p>`; return; }
    const rs = allItems().map(m => ({ m, f: fit(m, w, d, hh) })).filter(x => x.f);
    const line = x => `<button type="button" data-pick="${x.m.id}"><div class="t"><b>${esc(x.m.n)}</b><span class="tag ${x.f.st}">${vlab(x.m, x.f)}</span></div><small>${x.f.parts.join(' · ')}</small></button>`;
    const near = rs.filter(x => relevant(x.m, w, d)), rest = rs.filter(x => !relevant(x.m, w, d));
    const g = (list, k) => list.filter(x => x.f.st === k).sort((a, b) => a.f.score - b.f.score);
    const ok = g(near, 'rec').concat(g(near, 'max')), no = g(near, 'no');
    let h = '';
    if (ok.length) h += `<h3>${ok.length > 1 ? `Cabe en ${ok.length} espacios` : 'Cabe en 1 espacio'}</h3>` + ok.map(line).join('');
    else h += `<div class="vd no"><b>No cabe en ningún espacio parecido</b><span>${no.length ? 'Mira abajo cuánto te pasas.' : 'Revisa las medidas que escribiste.'}</span></div>`;
    if (no.length) h += `<h3>No cabe, pero es parecido</h3>` + no.map(line).join('');
    if (rest.length) h += showAll ? `<h3>Otros espacios de otro tamaño</h3>` + rest.sort((a, b) => a.f.score - b.f.score).map(line).join('') : `<button type="button" class="btn line sm" data-more style="justify-content:center">Ver los otros ${rest.length} espacios</button>`;
    out.innerHTML = h;
  };
  ['#gw', '#gd', '#gh'].forEach(s => $(s).addEventListener('input', run));
  setTimeout(() => { try { $('#gw').focus(); } catch (e) {} }, 80);
}

addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });

/* ================= unidad ================= */
function setUnit(u) {
  S.unit = u; save();
  $$('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.unit === u));
  ['v1', 'v2'].forEach(k => { const p = plans[k]; const sel = p.sel; p.render(); if (sel) p.select(sel); });
  renderMuebles(); renderCot();
  if (sheetOpen && sheetKind === 'mueble' && cur) { const id = cur.id; openMueble(id); }
  else if (sheetOpen && sheetKind === 'cabe') openCabe();
}
$$('.seg button').forEach(b => b.addEventListener('click', () => { if (b.dataset.unit !== S.unit) setUnit(b.dataset.unit); }));

/* ================= aviso ================= */
let toastT = 0;
function toast(t) {
  $$('.toast').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2200);
}

/* ================= inicio ================= */
mountPlan(1); mountPlan(2); mountMuebles(); mountCot();
$$('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.unit === S.unit));
const h0 = (location.hash || '').slice(1);
showTab(['v1', 'v2', 'muebles', 'cot'].includes(h0) ? h0 : 'muebles');
if ('serviceWorker' in navigator && window.isSecureContext) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
